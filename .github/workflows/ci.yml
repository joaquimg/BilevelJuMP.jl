name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      XPAUTH_XPR: ${{ secrets.XPAUTH_XPR }}
      XPRESS_JL_SKIP_LIB_CHECK: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10', os: windows-latest, arch: x64}
          - {version: '1.10', os: ubuntu-latest, arch: x64}
          - {version: '1', os: ubuntu-latest, arch: x64}
          # macOS is omitted: MibS_jll installs on macOS but ships no `mibs`
          # executable for aarch64, so the MibS tests fail with
          # `UndefVarError: mibs not defined in MibS_jll`. Adding macOS needs the
          # availability guard that #243 introduces in test/test_mibs.jl.
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Write the Xpress community/CI licence to disk so Xpress.jl can find it.
      # Mirrors jump-dev/MathOptInterface.jl .github/workflows/solver-tests.yml.
      # Obtain an Xpress licence from the community licence that the PyPI `xpress`
      # wheel bundles as xpress/license/community-xpauth.xpr, falling back to the
      # XPAUTH_XPR secret (see https://pypi.org/project/xpress).
      # The licence caps the solver release it authorises ("licensing error 21:
      # Your license only authorizes up to release X"), so the wheel and Xpress_jll
      # have to line up. 9.8.1 is the newest wheel still bundling a licence, which
      # is why test/Project.toml pins Xpress_jll to =9.8.0.
      - name: Setup Xpress licence
        shell: bash
        run: |
          set -euo pipefail
          # The XPAUTH_XPR secret expired on 28-feb-2026, so prefer the bundled
          # community licence and fall back to the secret only if the wheel cannot
          # be fetched. Swap the order once the secret is renewed.
          if python -m pip install --quiet --no-deps --target "$RUNNER_TEMP/xp" "xpress==9.8.1"; then
            cp "$RUNNER_TEMP/xp/xpress/license/community-xpauth.xpr" "$RUNNER_TEMP/xpauth.xpr"
            echo "Using community licence from the xpress PyPI wheel"
          elif [ -n "${XPAUTH_XPR:-}" ]; then
            echo "$XPAUTH_XPR" > "$RUNNER_TEMP/xpauth.xpr"
            echo "Using XPAUTH_XPR secret"
          else
            echo "No Xpress licence available; Xpress tests will skip"
            exit 0
          fi
          grep -o 'expiry="[^"]*"' "$RUNNER_TEMP/xpauth.xpr" || true
          echo "XPAUTH_PATH=$RUNNER_TEMP/xpauth.xpr" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
