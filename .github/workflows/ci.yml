name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      XPAUTH_XPR: ${{ secrets.XPAUTH_XPR }}
      XPRESS_JL_SKIP_LIB_CHECK: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10', os: windows-latest, arch: x64}
          - {version: '1.10', os: ubuntu-latest, arch: x64}
          - {version: '1', os: ubuntu-latest, arch: x64}
          # macos-latest is ARM64, so arch must be aarch64, not x64
          - {version: '1', os: macos-latest, arch: aarch64}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Write the Xpress community/CI licence to disk so Xpress.jl can find it.
      # Mirrors jump-dev/MathOptInterface.jl .github/workflows/solver-tests.yml.
      - name: Setup Xpress licence
        if: ${{ env.XPAUTH_XPR != '' }}
        shell: bash
        run: |
          echo "$XPAUTH_XPR" > "$RUNNER_TEMP/xpauth.xpr"
          echo "XPAUTH_PATH=$RUNNER_TEMP/xpauth.xpr" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
